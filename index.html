<script>
// E34 525i (M50B25 non-VANOS) longitudinal model. Verified data: 141 kW (192 PS) @ 6000, 245 Nm @ 4700, kerb 1480 kg, 205/65 R15, wheelbase 2761 mm,
// ZF S5D 310Z 4.21/2.49/1.67/1.24/1.00, final drive 3.23, factory 0-100 km/h 8.6 s. From the owner's recording: limiter 6490 rpm, idle 737 rpm,
// closed-throttle free decel 1850+0.12*(6490-rpm) rpm/s, floored free-rev 3330->6450 rpm in 0.5 s (gives the rotating inertia).
